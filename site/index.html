<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KnowLever Open — 知识库入口</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <img src="assets/logo.svg" alt="KnowLever" width="72" height="72" />
      <div>
        <h1>KnowLever Open</h1>
        <p>开源知识编译工具 — 用命令行构建可浏览的知识库，从这里进入各个 topic 站点。</p>
        <span class="hero-badge">单用户 · MiniMax-M2.7-highspeed · MIT</span>
      </div>
    </header>

    <div class="notice" id="serve-notice">
      须先在本项目目录执行 <code>npm run home</code>，再用浏览器打开
      <a href="http://127.0.0.1:4180/">http://127.0.0.1:4180/</a>。
      不要直接双击 <code>index.html</code>（会无法加载知识库列表）。
    </div>

    <h2>知识库</h2>
    <div class="grid" id="topic-grid">
      <p class="loading">加载中…</p>
    </div>

    <footer>
      <p>新增库：<code>npm run pipeline -- --topic &lt;name&gt;</code>，并在 <code>site/topics.json</code> 登记链接。</p>
    </footer>
  </div>
  <script>
    fetch('topics.json')
      .then((r) => r.json())
      .then((topics) => {
        const grid = document.getElementById('topic-grid');
        grid.innerHTML = topics.map((t) => `
          <a class="card" href="${t.href}" ${t.status !== 'ready' ? 'onclick="return false" style="opacity:0.55;cursor:default"' : ''}>
            <h3>${t.title}</h3>
            <p>${t.description}</p>
            <div class="meta">
              <span class="status-${t.status}">${t.status === 'ready' ? '可浏览' : '待创建'}</span>
              <span>${t.pages ? t.pages + ' 页' : ''}</span>
            </div>
          </a>
        `).join('');
      })
      .catch(() => {
        document.getElementById('topic-grid').innerHTML =
          '<p class="err">无法加载 topics.json — 请用 <code>npm run home</code> 启动后再访问 4180 端口。</p>';
      });
  </script>
</body>
</html>
