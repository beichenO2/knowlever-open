problems:
  - id: "prob_001"
    source_span: "offset 0-805"
    has_solution: false
    content: "作业 4\n\n1.请解释振幅法测角的原理，并说明最大信号法测角为什么不能用于角度跟踪。\n\n2.在圆锥扫描跟踪雷达中，若扫描速度为 15 转/分，对下图所示的 A、B、C 三个位置的目标，分别画出接收机的输出视频脉冲序列，并在各图中标明视频序列最大值出现的时刻。\n\n[图：坐标系中，X轴(t=0)，Y轴。圆形波束中心轨迹上标注三个点：A(1,0)、B(-1,$\\sqrt{3}$)、C(-1,-1)。]\n\n3.采用双天线相位法测角，$d_{12} = 0.5\\lambda$，设目标所在的角度为 $\\theta = 60°$，则两天线收到目标回波的相位差的理论值 $\\varphi_{12}$ 为多少？设两通道间存在相位误差为 $\\pm 5°$，则对该目标的测角精度为多少？为了提高测角精度，再设置 3 号天线，并使 $d_{23} = 2.5\\lambda$，$d_{13} = 3\\lambda$，通道间相位误差不变，则采用三天线相位法测角，精度最高可达多少？\n\n4.设某相控阵雷达的工作波长 $\\lambda = 3cm$，主波束指向阵面法线方向时，波束宽度 $\\theta_B = 3°$，若要求扫描正负 $45°$ 度范围内无栅瓣，则阵元间距为多少？(设雷达采用均匀线阵)，若阵元间距为半波长，则需要多少个阵元？若要使波束指向 $30°$，则相邻阵元间相位差应控制为多少？\n\n5.某相控阵雷达采用 8 位数字移相器（移相范围 $360°$），试计算\n① 该移相器的移相精度。\n② 若移相器的控制编码为(AA)H，则移相值为多少？\n③ 若需移相 $45°$，该移相器的最佳控制编码为多少？\n\n6.试解释 LFM 信号匹配滤波后主副比在 13.4dB 左右的原因，并说明距离旁瓣抑制的方法和意义。\n\n7.思考相控阵天线均匀线阵阵列方向图函数主副比在 13.4 左右的原因，说明研究天线方向图旁瓣抑制的意义。\n"
